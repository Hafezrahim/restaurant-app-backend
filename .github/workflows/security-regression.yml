name: Security Regression Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-run daily so drift in the hosted Supabase config (e.g. someone
    # toggling leaked-password protection off) is caught even without a commit.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  security-scan:
    name: Fail build if remediated findings regress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'tbdhusuyokibidemwzcw' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Non-zero exit code from the script fails the CI job. The script
      # verifies every finding listed in scripts/security-regression-check.ts:
      #   - SUPA_anon_security_definer_function_executable
      #   - SUPA_authenticated_security_definer_function_executable
      #   - SUPA_pg_graphql_anon_table_exposed
      #   - SUPA_pg_graphql_authenticated_table_exposed
      #   - SUPA_auth_leaked_password_protection
      - name: Run security regression check
        run: bun run scripts/security-regression-check.ts
