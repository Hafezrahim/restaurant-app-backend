name: RLS Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rls-tests:
    name: Verify RLS access-control policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://tbdhusuyokibidemwzcw.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fail the build immediately if ANY access-control scenario regresses.
      # The --bail=1 flag stops on the first failing test so the log is easy to read,
      # and a non-zero exit code is what fails the CI job.
      - name: Run RLS regression tests
        run: bunx vitest run src/test/rls.test.ts src/test/rls-mutations.test.ts --reporter=verbose --bail=1
